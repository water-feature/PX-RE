name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify published checksums
        run: |
          # Routine guides can change without rebuilding checksum inventories.
          # Retain checks for code, build inputs and research/validation evidence.
          check_inventory() {
            awk 'tolower($0) !~ /  (\.\/)?(.*\/)?(readme|contributing|firmware_map|recovery|build_version_history)\.md$/' SHA256SUMS |
              sha256sum --check --quiet -
          }
          check_inventory
          find 'PX patch history' 'SSD expansion' -name SHA256SUMS -print0 | while IFS= read -r -d '' inventory; do
            (cd "$(dirname "$inventory")" && check_inventory) || exit 1
          done
      - name: Check repository links
        run: python tools/check_links.py
      - name: Test container parser with synthetic fixtures
        run: python -m unittest discover -s tests -v
