name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify published checksums
        run: |
          sha256sum --check --quiet SHA256SUMS
          find 'PX patch history' 'SSD expansion' -name SHA256SUMS -print0 | while IFS= read -r -d '' inventory; do
            (cd "$(dirname "$inventory")" && sha256sum --check --quiet SHA256SUMS) || exit 1
          done
      - name: Check repository links
        run: python tools/check_links.py
      - name: Test container parser with synthetic fixtures
        run: python -m unittest discover -s tests -v
